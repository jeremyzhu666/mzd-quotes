<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Verses — 诗词生成器</title>
    <meta name="description" content="极简、克制、充满秩序感的诗词随机生成与图片分享工具。">
    <meta property="og:title" content="Verses — 诗词生成器">
    <meta property="og:description" content="一句诗，一张图，一种秩序之美。">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- display=swap：字体可见性完全由我们自己的 opacity 门控统一接管。
         iOS Safari 上 Google Fonts 自带的 display=block 解锁时机与我们的 fonts-loaded 门控时序打架，
         会导致"opacity 先淡入 → 字体后加载"的半渲染观感。改为 swap 后，两套机制的冲突消除：
         我们的 opacity 门控（真实度量字形后才淡入）成为唯一的显示开关，两端完全一致。 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="white" tabindex="-1" style="outline: none;">
    <main class="container">
        <header class="site-header">
            <h1 class="site-title">主席诗词随机生成工具</h1>
        </header>

        <section class="poem-area" id="poemArea">
            <p class="poem-text" id="poemText">雄关漫道真如铁，而今迈步从头越。</p>
            <p class="poem-source" id="poemSource">—— 忆秦娥·娄山关</p>
        </section>

        <section class="controls">
            <div class="theme-switcher">
                <button class="theme-btn" data-theme="white" aria-label="纸白配色"></button>
                <button class="theme-btn" data-theme="black" aria-label="墨黑配色"></button>
                <button class="theme-btn" data-theme="gray" aria-label="素灰配色"></button>
            </div>

            <div class="actions">
                <div class="action-row action-row-primary">
                    <button class="action-btn" id="generateBtn" type="button">
                        <span class="btn-label">随机生成</span>
                    </button>
                </div>
                <div class="action-row action-row-secondary">
                    <button class="action-btn" id="downloadBtn" type="button">图片分享</button>
                    <button class="action-btn" id="copyBtn" type="button">网址复制</button>
                </div>
            </div>
        </section>
    </main>

    <div class="toast" id="toast"></div>

    <script src="poems.js"></script>
    <script src="script.js"></script>
</body>
</html>
